        #img1 {
          position: absolute; right: 10px; top: 9px;
          width: 36px; height: 36px; padding: 8px; box-sizing: border-box;
          background: #e8f1f9; border: 1px solid #ffffff; border-radius: 18px;

        #hl2 { position: absolute; left: 0; top: 59px; width: 480px; height: 0;
               border: none; margin: 0; }

          box-sizing: border-box; background: #ffffff;
          border: 1px solid #d3dde7; border-left: 3px solid #1f8fff;

          font-size: 11px; color: #7b8ea1;

          font-size: 22px; font-weight: bold; color: #16324a; letter-spacing: 1px;
          white-space: nowrap; overflow: hidden;

        .tile {
          position: absolute; width: 110px; height: 126px;
          box-sizing: border-box; padding: 0; margin: 0;
          background: #ffffff; border: 1px solid #cfd9e3; border-radius: 8px;
          font-family: inherit; color: #28405a; text-align: center;
          cursor: pointer; outline: none;

        .tile:disabled { background: #f2f5f8; border-color: #dfe6ec; color: #a9b7c4; cursor: default; }
        .tile svg { display: block; width: 34px; height: 34px; margin: 17px auto 0 auto; }
        .tile span { display: block; margin-top: 9px; padding: 0 3px;
                     font-size: 13px; font-weight: bold; line-height: 17px; }

          text-align: center; font-size: 11px; color: #8b9cab;

        #hl1 { position: absolute; left: 10px; top: 586px; width: 460px; height: 0;
               border: none; border-top: 1px solid #d7e0e8; margin: 0; }
